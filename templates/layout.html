<!DOCTYPE html>

<html lang="en">

    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>{% block title %}{% endblock %}</title>

        <!-- Link to the Bootstrap CSS library (https://getbootstrap.com/) -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH">
        <!-- Link to the Boostrap icons library (https://icons.getbootstrap.com/) -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+">
        <!-- Link to the Bootstrap Javascript library (https://getbootstrap.com/) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

        <link rel="stylesheet" href="/static/styles.css">
        <link rel="icon" href="/static/images/favicon.ico">

        {% block javascript %}{% endblock %}

    </head>

    <body>

        <div class="container-fluid min-vh-100 d-flex flex-column">
            <a id="top"></a>
            <nav class="row navbar navbar-expand-md bg-dark py-0" data-bs-theme="dark">
                <div class="container-fluid py-1">
                    <button class="btn btn-dark rounded-0 pe-0 position-absolute">
                        <a class="navbar-brand" href="/">
                            <!-- Referred to https://icons.getbootstrap.com/icons/camera/ for Bootstrap icon mark-up -->
                            <i class="bi-camera fs-3"></i>
                            <span class="align-middle pb-2"><span class="red">P</span><span class="green">h</span><span class="yellow">o</span><span class="purple">t</span><span class="blue">o</span><span class="orange">s</span></span>
                        </a>
                    </button>
                    <ul class="navbar-nav mx-auto">
                        <button class="btn btn-dark rounded-0">
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle text-white" data-bs-toggle="dropdown" href="#"><span class="green">Landscapes</span></a>
                                <ul class="dropdown-menu">
                                    <li>
                                        <a class="dropdown-item text-white" href="/landscapes/maine">Maine</a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item text-white" href="/landscapes/new_york">New York</a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item text-white" href="/landscapes/south_dakota">South Dakota</a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item text-white" href="/landscapes/wyoming">Wyoming</a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item text-white" href="/landscapes/arizona">Arizona</a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item text-white" href="/landscapes/utah">Utah</a>
                                    </li>
                                </ul>
                            </li>
                        </button>
                        <li class="nav-item">
                            <button class="btn btn-dark rounded-0">
                                <a class="nav-link text-white" href="/birds"><span class="blue">Birds</span></a>
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="btn btn-dark rounded-0">
                                <a class="nav-link text-white" href="/flowers"><span class="purple">Flowers</span></a>
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="btn btn-dark rounded-0">
                                <a class="nav-link text-white" href="/animals"><span class="red">Animals</span></a>
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="btn btn-dark rounded-0">
                                <a class="nav-link text-white" href="/search"><span class="yellow">Search</span></a>
                            </button>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="row container-fluid py-4 flex-grow-1">
                <h1 class="text-center display-4 fw-medium">{% block heading %}{% endblock %}</h1>
                {% block content %}{% endblock %}
            </main>

            <footer class="row navbar navbar-expand-md bg-dark py-1" data-bs-theme="dark">
                <div class="container-fluid">
                    <ul class="navbar-nav">
                        <li class="nav-item px-3 py-1">
                            <a class="nav-link text-white">&copy;2025</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <button class="btn btn-dark rounded-0">
                                <a href="#top" class="nav-link text-white">Back to top</a>
                            </button>
                        </li>
                    </ul>
                </div>
            </footer>
        </div>
        
    </body>

</html>
